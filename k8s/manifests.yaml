apiVersion: v1
kind: Namespace
metadata:
  name: privileged-access
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sentinel
  namespace: privileged-access
  labels:
    app: sentinel
spec:
  # Store is in-process and in-memory (backend/store.py), so replicas would each
  # hold divergent state and the dashboard would flicker between them. Keep at 1.
  replicas: 1
  selector:
    matchLabels:
      app: sentinel
  template:
    metadata:
      labels:
        app: sentinel
    spec:
      containers:
        - name: sentinel
          image: kanurkarprateek/privileged-access-sentinel:v1
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          readinessProbe:
            httpGet:
              path: /api/state
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/state
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: sentinel
  namespace: privileged-access
spec:
  type: ClusterIP
  selector:
    app: sentinel
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: sentinel
  namespace: privileged-access
spec:
  ingressClassName: nginx
  rules:
    - host: happenedbefore.prateekkanurkar.in
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: sentinel
                port:
                  number: 80
